<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-ray void cal v4.0</title>
<style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
        background: #1e1e1e; color: #ccc; font: 16px "Segoe UI", sans-serif; }
    button, input { font: inherit; }
    button { border: 0; background: #3c3c3c; color: inherit; padding: 8px; cursor: pointer; }
    button:hover { background: #4d4d4d; color: white; }
    button:focus-visible, input:focus-visible { outline: 2px solid #76c7ff; outline-offset: -2px; }
    header { height: 45px; flex: none; display: flex; align-items: stretch; background: #181818; }
    .icon { align-self: center; padding: 0 12px; }
    nav { display: flex; }
    nav details { position: relative; }
    summary { height: 100%; display: grid; align-items: center; padding: 0 20px; cursor: pointer; }
    summary::-webkit-details-marker { display: none; }
    summary:hover, details[open] summary { background: #333; color: white; }
    .menu { position: absolute; z-index: 5; width: max-content; background: #252526; border: 1px solid #555; padding: 2px; }
    .menu button { display: flex; align-items: center; justify-content: space-between; gap: 25px;
        width: 100%; background: transparent; text-align: left; font-size: 14px; padding: 8px 15px; }
    .menu button:hover, .menu button[aria-pressed=true] { background: #094771; color: white; }
    .menu hr { border: 0; border-top: 1px solid #454545; }
    kbd { font: inherit; color: #aaa; }
    #title { margin: auto; padding: 0 8px; font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #fullscreen, #close { background: transparent; }
    #close:hover { background: #e81123; }
    .menu button:disabled { color: #888; cursor: wait; }
    main { flex: 1; display: flex; min-height: 0; }
    #viewport { position: relative; flex: 1; min-width: 0; overflow: hidden; }
    #view { display: block; width: 100%; height: 100%; touch-action: none; }
    aside { width: min(500px, 45vw); background: #252526; display: flex; flex-direction: column; min-height: 0; }
    #tabs, .row { display: flex; }
    #tabs button { flex: 1; background: #2d2d2d; color: #888; font-size: 17px; padding: 12px 0; }
    #tabs button.active { background: #252526; color: white; }
    #controls { flex: 1; overflow: auto; padding: 5px 15px; }
    h2 { font-size: 16px; margin: 8px 0 12px; }
    .row { gap: 10px; flex-wrap: wrap; align-items: center; }
    .check { display: flex; align-items: center; gap: 5px; padding: 3px 0; cursor: pointer; }
    input[type=checkbox] { accent-color: #007acc; width: 15px; height: 15px; }
    .slider { display: block; margin: 8px 0; }
    input[type=range] { display: block; width: 100%; margin: 2px 0; height: 24px; cursor: pointer;
        appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px;
        background: linear-gradient(to right, #007acc var(--position), #3e3e42 var(--position)); }
    input[type=range]::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%;
        background: #ccc; margin-top: -5px; }
    input[type=range]::-moz-range-track { height: 4px; background: #3e3e42; }
    input[type=range]::-moz-range-progress { height: 4px; background: #007acc; }
    .buttons, #tools { display: grid; gap: 3px; margin: 14px 0 10px; grid-template-columns: repeat(2, 1fr); }
    #tools { grid-template-columns: repeat(3, 1fr); }
    #tools button[aria-pressed=true] { background: #094771; color: white; }
    #optimize { background: #0e639c; color: white; }
    .row .slider { flex: 1; min-width: 100px; }
    footer { padding: 10px 25px; }
    #rate { text-align: center; font-size: 32px; font-weight: bold; color: #f14c4c; }
    #bar { background: #3e3e42; margin: 5px 0 10px; }
    #bar div { height: 4px; background: #f14c4c; }
    #status { margin-top: 5px; color: #89d185; }
    #status.error { color: #f14c4c; }
    #context { position: fixed; }
    dialog { width: min(600px, 94vw); height: min(500px, 85vh); padding: 0; color: #ccc; background: #1e1e1e; border: 1px solid #555; }
    dialog header { align-items: center; justify-content: space-between; padding-left: 15px; height: 35px; }
    dialog pre { white-space: pre-wrap; font: 14px/1.5 "Segoe UI", sans-serif; margin: 20px 25px; }
    @media (max-width: 650px) {
        main { flex-direction: column; }
        aside { width: 100%; height: 52%; }
        summary { font-size: 14px; padding: 0 8px; }
        footer { padding: 4px 15px; }
        footer h2 { margin: 3px 0; }
        #rate { font-size: 22px; }
    }
</style>
</head>
<body>
<header>
    <span class="icon" aria-hidden="true">💠</span>
    <nav>
        <details id="fileMenu"><summary data-text="m_file"></summary><div class="menu">
            <button data-action="open"><span data-text="m_open"></span><kbd>Ctrl+O</kbd></button>
            <button data-action="load"><span data-text="m_load"></span><kbd>Ctrl+L</kbd></button><hr>
            <button data-action="save"><span data-text="m_save"></span><kbd>Ctrl+S</kbd></button>
            <button data-action="export"><span data-text="m_export"></span><kbd>Ctrl+E</kbd></button><hr>
            <button data-action="close"><span data-text="m_close"></span><kbd>Ctrl+Q</kbd></button>
        </div></details>
        <details id="langMenu"><summary data-text="m_lang"></summary><div class="menu" id="languages"></div></details>
        <details id="helpMenu"><summary data-text="m_help"></summary><div class="menu">
            <button data-action="help" data-text="m_guide"></button>
        </div></details>
    </nav>
    <span id="title"></span><button id="close" data-action="close" aria-label="Close">✕</button>
    <button id="fullscreen" aria-label="Fullscreen" title="Fullscreen">🗖</button>
</header>
<input hidden type="file" id="fileInput" accept="image/*">
<input hidden type="file" id="projectInput" accept=".vod">
<main>
    <div id="viewport"><canvas id="view"></canvas></div>
    <aside>
        <div id="tabs">
            <button data-tab="image" data-text="tab_img"></button>
            <button data-tab="void" data-text="tab_void"></button>
            <button data-tab="edit" data-text="tab_edit"></button>
        </div>
        <div id="controls">
            <section id="image"><h2 data-text="p1_title"></h2><div class="row" id="imageChecks"></div></section>
            <section id="void" hidden><h2 data-text="p2_title"></h2><div id="detection"></div>
                <div class="buttons"><button id="optimize" data-text="btn_ai"></button><button id="accumulate" data-text="btn_acc"></button></div>
            </section>
            <section id="edit" hidden><h2 data-text="p3_title"></h2><div id="tools"></div>
                <div id="editControls"></div>
                <div class="buttons"><button id="undo" data-text="btn_undo"></button><button id="clear" data-text="btn_clear"></button></div>
                <div class="row" id="overlay"></div>
            </section>
        </div>
        <footer><h2 data-text="p4_title"></h2><div id="rate"></div><div id="bar"><div></div></div>
            <div id="watermark"></div><div id="status" role="status"></div>
        </footer>
    </aside>
</main>
<div id="context" class="menu" hidden></div>
<dialog id="guide"><header><span data-text="m_guide"></span><button aria-label="Close" onclick="this.closest('dialog').close()">✕</button></header><pre data-text="guide_txt"></pre></dialog>
